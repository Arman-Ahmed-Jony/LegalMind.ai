services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legalmind
      POSTGRES_PASSWORD: legalmind
      POSTGRES_DB: legalmind
    ports:
      - "5432:5432"
    volumes:
      - legalmind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalmind -d legalmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  legalmind_pg:
